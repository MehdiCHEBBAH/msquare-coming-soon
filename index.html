    <script>
        // Array of all available shoes (42 shoes)
        const shoes = [

            'shoe25.png', 'shoe26.png', 'shoe27.png', 'shoe28.png', 'shoe29.png', 'shoe30.png',
            'shoe31.png', 'shoe32.png', 'shoe33.png', 'shoe34.png', 'shoe35.png', 'shoe36.png',
            'shoe37.png', 'shoe38.png', 'shoe39.png', 'shoe40.png', 'shoe41.png',
        ];

        // 10 different layout shapes - all balanced across the page
        const layoutShapes = [
            // Shape 1: Balanced triangle (3 shoes) - top, left, right
            [
                { top: '12%', left: '50%', size: 310, shapeClass: 'shape1' },
                { top: '65%', left: '15%', size: 300, shapeClass: 'shape1' },

            ],
            // Shape 2: Cross pattern (4 shoes) - corners

                { top: '10%', left: '15%', size: 295, shapeClass: 'shape2' },
                { top: '10%', left: '75%', size: 310, shapeClass: 'shape2' },
                { top: '70%', left: '15%', size: 285, shapeClass: 'shape2' },
                { top: '70%', left: '75%', size: 300, shapeClass: 'shape2' }
            ],
            // Shape 3: Diamond formation (4 shoes) - center spread
            [
                { top: '15%', left: '40%', size: 300, shapeClass: 'shape3' },
                { top: '40%', left: '15%', size: 280, shapeClass: 'shape3' },
                { top: '40%', left: '75%', size: 310, shapeClass: 'shape3' },
                { top: '65%', left: '40%', size: 285, shapeClass: 'shape3' }
            ],
            // Shape 4: Scattered balance (4 shoes) - distributed
            [
                { top: '18%', left: '25%', size: 285, shapeClass: 'shape4' },
                { top: '18%', left: '70%', size: 300, shapeClass: 'shape4' },
                { top: '62%', left: '20%', size: 295, shapeClass: 'shape4' },
                { top: '62%', left: '70%', size: 310, shapeClass: 'shape4' }
            ],
            // Shape 5: T-shape (3 shoes) - horizontal top, vertical center
            [
                { top: '15%', left: '30%', size: 305, shapeClass: 'shape5' },
                { top: '15%', left: '60%', size: 295, shapeClass: 'shape5' },
                { top: '65%', left: '45%', size: 300, shapeClass: 'shape5' }
            ],
            // Shape 6: L-shape balanced (3 shoes) - top-left, top-right, bottom-center
            [
                { top: '12%', left: '20%', size: 290, shapeClass: 'shape6' },
                { top: '12%', left: '70%', size: 315, shapeClass: 'shape6' },
                { top: '68%', left: '45%', size: 300, shapeClass: 'shape6' }
            ],
            // Shape 7: Wide spread balanced (4 shoes) - edges
            [
                { top: '10%', left: '12%', size: 280, shapeClass: 'shape7' },
                { top: '10%', left: '78%', size: 305, shapeClass: 'shape7' },
                { top: '70%', left: '12%', size: 300, shapeClass: 'shape7' },
                { top: '70%', left: '78%', size: 290, shapeClass: 'shape7' }
            ],
            // Shape 8: Central cluster (3 shoes) - around center
            [
                { top: '25%', left: '35%', size: 300, shapeClass: 'shape8' },
                { top: '45%', left: '60%', size: 290, shapeClass: 'shape8' },
                { top: '55%', left: '25%', size: 310, shapeClass: 'shape8' }
            ],
            // Shape 9: Zigzag balanced (4 shoes) - alternating sides
            [
                { top: '15%', left: '20%', size: 295, shapeClass: 'shape9' },
                { top: '35%', left: '70%', size: 285, shapeClass: 'shape9' },
                { top: '55%', left: '20%', size: 305, shapeClass: 'shape9' },
                { top: '75%', left: '70%', size: 290, shapeClass: 'shape9' }
            ],
            // Shape 10: Arrow formation (3 shoes) - pointing up
            [
                { top: '15%', left: '45%', size: 310, shapeClass: 'shape10' },
                { top: '50%', left: '25%', size: 300, shapeClass: 'shape10' },
                { top: '50%', left: '65%', size: 295, shapeClass: 'shape10' }
            ]
        ];

        // Function to get random shoes
        function getRandomShoes(count) {
            const shuffled = [...shoes].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, count);
        }

        // Function to get suitable shapes based on screen size
        function getSuitableShapes() {
            const screenWidth = window.innerWidth;
            
            if (screenWidth <= 480) {
                // Mobile: Only use 2-3 shoe shapes (shapes 1, 5, 6, 8, 10)
                return [layoutShapes[0], layoutShapes[4], layoutShapes[5], layoutShapes[7], layoutShapes[9]];
            } else if (screenWidth <= 768) {
                // Tablets: Use 3 shoe shapes only (avoid 4 shoe shapes)
                return [layoutShapes[0], layoutShapes[4], layoutShapes[5], layoutShapes[7], layoutShapes[9]];
            } else if (screenWidth <= 1024) {
                // Medium screens: All 3-shoe shapes plus some balanced 4-shoe shapes
                return [layoutShapes[0], layoutShapes[1], layoutShapes[4], layoutShapes[5], layoutShapes[7], layoutShapes[9]];
            } else {
                // Desktop: All shapes available
                return layoutShapes;
            }
        }

        // Function to get random layout shape
        function getRandomShape() {
            const suitableShapes = getSuitableShapes();
            return suitableShapes[Math.floor(Math.random() * suitableShapes.length)];
        }

        // Function to display random shoes with random shape
        function displayRandomShoes() {
            const shoesDisplay = document.getElementById('shoesDisplay');
            const selectedShape = getRandomShape();
            const shoeCount = selectedShape.length; // Get the number of shoes in this shape
            const randomShoes = getRandomShoes(shoeCount);
            
            shoesDisplay.innerHTML = '';
            
            randomShoes.forEach((shoe, index) => {
                const shoeElement = document.createElement('div');
                shoeElement.className = `random-shoe shoe-${index + 1} ${selectedShape[index].shapeClass}`;
                
                // Apply shape configuration
                const shapeConfig = selectedShape[index];
                shoeElement.style.top = shapeConfig.top;
                shoeElement.style.left = shapeConfig.left;
                shoeElement.style.width = shapeConfig.size + 'px';
                shoeElement.style.height = shapeConfig.size + 'px';
                
                shoeElement.innerHTML = `<img src="assets/shoes/${shoe}" alt="Authentic ${shoe.replace('.png', '').replace('shoe', 'Shoe')} - M_SQUARE Collection" class="shoe-image" loading="lazy">`;
                shoesDisplay.appendChild(shoeElement);
            });
        }

        // Load random shoes when page loads
        document.addEventListener('DOMContentLoaded', function() {
            // Add a small delay to ensure smooth loading
            setTimeout(displayRandomShoes, 100);
        });
        
        // Reload shoes on window resize to adapt to new screen size
        let resizeTimer;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function() {
                displayRandomShoes();
            }, 250);
        });

        // Performance optimization: Preload next set of shoes
        function preloadNextShoes() {
            const nextShoes = getRandomShoes(4);
            nextShoes.forEach(shoe => {
                const img = new Image();
                img.src = `assets/shoes/${shoe}`;
            });
        }

        // Preload after initial load
        setTimeout(preloadNextShoes, 2000);

        // Brand typing animation
        const brands = ['Nike', 'Adidas', 'Sketchers', 'New Balance', 'Puma', 'Reebok', 'Hummel', 'Asics', 'Hi-Tec', 'Vans', 'Converse', 'Under Armour', 'Puma', 'Reebok', 'Hummel', 'Asics', 'Hi-Tec', 'Vans', 'Converse', 'Under Armour'];
        let currentBrandIndex = 0;
        const brandElement = document.getElementById('brand-text');
        
        function typeText(text, speed, callback) {
            let index = 0;
            brandElement.textContent = '';
            
            function typeChar() {
                if (index < text.length) {
                    brandElement.textContent += text[index];
                    index++;
                    setTimeout(typeChar, speed);
                } else if (callback) {
                    callback();
                }
            }
            
            typeChar();
        }
        
        function eraseText(speed, callback) {
            function eraseChar() {
                if (brandElement.textContent.length > 0) {
                    brandElement.textContent = brandElement.textContent.slice(0, -1);
                    setTimeout(eraseChar, speed);
                } else if (callback) {
                    callback();
                }
            }
            
            eraseChar();
        }
        
        function cycleBrands() {
            const currentBrand = brands[currentBrandIndex];
            
            // Type the brand name
            typeText(currentBrand, 150, () => {
                // Wait 2 seconds, then erase
                setTimeout(() => {
                    eraseText(80, () => {
                        // Move to next brand
                        currentBrandIndex = (currentBrandIndex + 1) % brands.length;
                        // Wait 500ms before starting next cycle
                        setTimeout(cycleBrands, 500);
                    });
                }, 2000);
            });
        }
        
        // Start the typing animation after page load
        setTimeout(cycleBrands, 1000);
    </script>
